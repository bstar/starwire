name: ci

# Documentation-only changes do not rebuild anything.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *docs
  workflow_call:
  workflow_dispatch:

# Nothing here needs write access. Declared rather than inherited, so a change
# to the repository default cannot quietly widen what a workflow may do.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No build dependencies. SQLite is compiled from the amalgamation
      # `rusqlite`'s `bundled` feature carries, TLS is rustls through `ureq`,
      # and nothing runs bindgen, so there is nothing to apt-get. Adding a
      # `-sys` crate means adding a step here.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # First, and cheap: Cargo.toml and Cargo.lock must agree.
      - run: ./scripts/check-version.sh
      - run: cargo fmt --check
      # dead_code is allowed rather than denied: the core lands milestone by
      # milestone, complete and tested, ahead of the UI that will reach it.
      # Every other lint is an error.
      - run: cargo clippy --all-targets -- -D warnings -A dead_code
      # Anything that needs the network is gated behind STARWIRE_TEST_NET,
      # and the yt-dlp tests also want the binary on PATH.
      - run: cargo test --all
      - name: Preserve the cell-only build
        run: cargo test --locked --no-default-features

  native-preview:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the locked KIT fixture revision
        id: kit
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('Cargo.lock', 'rb') as source:
              packages = tomllib.load(source)['package']
          kit = next(package for package in packages if package['name'] == 'starkit')
          print('revision=' + kit['source'].rsplit('#', 1)[1])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bstar/starkit
          ref: ${{ steps.kit.outputs.revision }}
          path: .kit-fixture
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install private terminal test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libegl1 libxcb-xkb1 libxkbcommon-x11-0 libxcb-cursor0
          bash .kit-fixture/scripts/install-test-kitty.sh "$RUNNER_TEMP/kitty-proof"
      - run: cargo build --locked
      - name: Verify graphical and cell reader workflows in Kitty
        run: |
          xvfb-run -a python3 scripts/test-graphical-ui.py \
            --kit .kit-fixture \
            --kitty "$RUNNER_TEMP/kitty-proof/runtime/bin/kitty" \
            --kitten "$RUNNER_TEMP/kitty-proof/runtime/bin/kitten" \
            --binary target/debug/starwire \
            --output framework-ui-proof --display-server x11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: framework-ui-proof
          path: framework-ui-proof/

  # macOS is a supported target, and most of what breaks there breaks at
  # compile time -- a `cfg` that assumed Linux, a path that assumed XDG, the
  # opener that is `open` there and `xdg-open` everywhere else -- so a build
  # is most of the value.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Still nothing to install. The bundled SQLite compiles against the
      # SDK the runner already has, so there is no Homebrew line and no
      # LIBCLANG_PATH to set.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets -- -D warnings -A dead_code
      - run: cargo test --all

  # What the dependency tree is carrying, which nobody notices by reading it.
  # Two questions: is anything under a known advisory, and is anything under a
  # licence this cannot ship. See `deny.toml` for what is allowed and why.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  msrv:
    # rust-version in Cargo.toml is a promise; this is what makes it true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all-targets
