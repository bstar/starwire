# cargo-deny: what the dependency tree is allowed to contain.
#
# Two questions, both of which someone has to answer eventually and neither of
# which anyone answers by hand: is a dependency carrying a known vulnerability,
# and is one carrying a licence this project cannot ship under.

[advisories]
# Vulnerabilities and yanked releases stop the build. Those are ours to act on
# however deep in the tree they are: the fix is a version bump, and if there is
# not one yet that is worth knowing today rather than at release.
#
# More is at stake here than anywhere else in the family. Every byte this
# program parses came off somebody else's web server: a feed, an HTML page, a
# redirect chain. The HTML parsers and the feed parser are the largest
# attack surface in the tree and the ones an advisory is most likely to name.
yanked = "deny"

# Unmaintained crates only when we depend on one directly. A crate we chose and
# that has since been abandoned is a decision to revisit; one three levels down
# is its parent's decision, not ours, and cannot be fixed here.
unmaintained = "workspace"


[licenses]
# Everything in the tree today, and nothing else. Adding a dependency under a
# licence not on this list is meant to stop CI and be a decision.
#
# The list is STAR/FOLD's plus what a news reader's own tree carries. Four
# entries are worth knowing about --
#
#   MPL-2.0               nucleo-matcher, which ranks the filter's results.
#                         Copyleft per *file*: using it as a library carries
#                         no obligation beyond publishing changes to its own
#                         files, and there are none.
#
#   Apache-2.0            htmd, the HTML-to-Markdown converter, and the
#                         html5ever tree under it. Permissive and compatible
#                         with shipping this under MIT; it is listed because
#                         the alternative, `html2md`, is GPL-3.0-or-later and
#                         would not be. The one thing Apache-2.0 asks for that
#                         MIT does not is that a modified file say so, and
#                         nothing here is vendored or modified.
#
#   CDLA-Permissive-2.0   webpki-roots, which is Mozilla's root certificate
#                         store repackaged as a crate. A *data* licence rather
#                         than a software one, which is why it is not on any
#                         of the usual lists: it permits use and redistribution
#                         of the data with no notice obligation and no
#                         copyleft. It arrives under `ureq`, and it is what
#                         makes an https fetch able to verify anything.
#
#   ISC                   leaf crates in the rustls lineage. Permissive, and
#                         equivalent to the two-clause BSD above in everything
#                         but wording.
#
# `cargo deny check licenses` warns about an allowance nothing matches, so an
# entry that stops being needed shows up as a warning rather than sitting here
# forever.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# A crate offering a choice takes the first of these it can satisfy, so a
# dual-licensed dependency resolves to the permissive half rather than to
# whatever its manifest happens to list first.
[licenses.private]
ignore = true

[bans]
# Duplicate versions of one crate are ordinary in a tree this size and are the
# resolver's business, not a licence question.
#
# One of them here is a decision rather than an accident, and it is written
# down in `Cargo.toml` and in the plan: `htmd` is on html5ever 0.38 and
# `dom_smoothie` reaches html5ever 0.39 through `dom_query`, so the tree
# carries two HTML tokenizers. That is accepted for 0.0.1 because both are
# behind one seam -- `extract/markdown.rs::to_markdown` is the only caller of
# `htmd` -- and the replacement, a serializer over the `dom_query` tree that
# is already in the graph, is one file rather than a dependency change.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Nothing from a git URL or a private registry: everything comes from crates.io,
# so a compromised or vanished repository cannot reach a build.
unknown-registry = "deny"
unknown-git = "deny"

# The one exception, named rather than allowed by loosening the rule above.
# STAR/KIT is the foundation this and its three siblings stand on and is pinned
# to a revision; it is not published to crates.io because its API is whatever
# its consumers need and a version on a registry would suggest otherwise.
allow-git = ["https://github.com/bstar/starkit"]
